# XcodeGen manifest of the S3 iOS probe (docs/spikes/S3.md §6.3). The .xcodeproj is generated on the CI runner by
# the ios-builder workflow ("Generate Xcode project (XcodeGen)") and is never committed (.gitignore).
name: NapStopProbe
options:
  bundleIdPrefix: app.napstop
  developmentLanguage: vi
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: NO
    # Pinned (review #10): Xcode 26 templates default to MainActor isolation; this code assumes nonisolated.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
targets:
  NapStopProbe:
    type: application
    platform: iOS
    sources:
      - path: NapStopProbe
        excludes:
          - Info.plist
      - path: ProbeCore/Sources/ProbeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.napstop.probe
        INFOPLIST_FILE: NapStopProbe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
