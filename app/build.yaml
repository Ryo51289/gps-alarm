# drift code generation (T22 §5.3). Generated *.g.dart files are committed;
# CI regenerates them and fails on any difference.
#   dart run build_runner build
#   dart run drift_dev make-migrations   (after a schema change)
targets:
  $default:
    builders:
      drift_dev:
        generate_for:
          - lib/core/db/**.dart
        options:
          databases:
            app: lib/core/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
