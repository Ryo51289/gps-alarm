name: napstop
description: "NapStop - ngủ không lỡ trạm: báo thức theo vị trí cho người đi xe khách, tàu đường dài."
# Private app, never published to pub.dev.
publish_to: 'none'

# build-name -> Android versionName / iOS CFBundleShortVersionString,
# build-number -> Android versionCode / iOS CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  # gen-l10n (T20). intl version is pinned by flutter_localizations.
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests (T14 I01).
  integration_test:
    sdk: flutter
  # Pinned exactly: generated code is committed and checked byte for byte in CI (T14).
  pigeon: 29.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # gen-l10n from l10n.yaml (T20); output in lib/l10n/gen (not committed).
  generate: true
  # Offline station dataset (T24), built by tools/stationgen. Loaded lazily.
  assets:
    - assets/stations.json
    # Be Vietnam Pro license, shown on the license page (T20).
    - assets/fonts/BeVietnamPro/OFL.txt
  # Be Vietnam Pro (T20), see assets/fonts/BeVietnamPro/README.md.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
  # Used when no --flavor is given (flutter run, flutter build apk --debug).
  default-flavor: dev
