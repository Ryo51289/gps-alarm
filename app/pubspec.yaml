name: napstop
description: "NapStop - ngủ không lỡ trạm: báo thức theo vị trí cho người đi xe khách, tàu đường dài."
# Private app, never published to pub.dev.
publish_to: 'none'

# build-name -> Android versionName / iOS CFBundleShortVersionString,
# build-number -> Android versionCode / iOS CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^1.0.8
  # Local database (T22): code generated by drift_dev is committed.
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  # Telemetry (T29): only the adapters in lib/core/telemetry/** import these.
  # Without Firebase options (step A, or iOS before T29 §5) the app runs noop.
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  # gen-l10n (T20). intl version is pinned by flutter_localizations.
  flutter_localizations:
    sdk: flutter
  # State management (T22). Providers written by hand, no generator.
  flutter_riverpod: ^3.4.3
  # 17.x on purpose: 18.x moves to material_ui (T22 D1).
  go_router: ^17.5.0
  intl: any
  # App logger with levels (T29 §4.3).
  logging: ^1.3.0
  # @immutable for the pure Dart domain types (T22). Pinned by the Flutter SDK.
  meta: any
  # App version on screen 12 (T28 D15).
  package_info_plus: ^10.2.2
  path: ^1.9.0
  path_provider: ^2.1.6
  # Trip defaults and alarm preferences (T25 A5; T28 writes them).
  shared_preferences: ^2.5.6
  # Android options of SharedPreferencesAsync (T21 review #3): screen 0 flags in their
  # own file, excluded from backup. Already resolved as a transitive dependency.
  shared_preferences_android: ^2.5.4
  # OpenStreetMap copyright page from screen 2 (T23).
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  # drift code generation and schema snapshots (T22).
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  # On-device tests (T14 I01).
  integration_test:
    sdk: flutter
  # Pinned exactly: generated code is committed and checked byte for byte in CI (T14).
  pigeon: 29.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # gen-l10n from l10n.yaml (T20); output in lib/l10n/gen (not committed).
  generate: true
  # Offline station dataset (T24), built by tools/stationgen. Loaded lazily.
  assets:
    - assets/stations.json
    # T24.3: bus stops of Hà Nội and TP. Hồ Chí Minh (stationgen), loaded on
    # the second letter typed or the "Trạm buýt" chip.
    - assets/bus_stops.json
    # Screen 9 battery guides per brand (T21 §6.3); texts are ARB keys.
    - assets/battery_guides.json
    # T18: simulation traces (byte copies of fixtures/traces) + catalog.json,
    # built by `tools/tracegen: dart run bin/tracegen.dart bundle-sim`.
    - assets/sim/
    # Be Vietnam Pro license, shown on the license page (T20).
    - assets/fonts/BeVietnamPro/OFL.txt
  # Be Vietnam Pro (T20), see assets/fonts/BeVietnamPro/README.md.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
  # Used when no --flavor is given (flutter run, flutter build apk --debug).
  default-flavor: dev
