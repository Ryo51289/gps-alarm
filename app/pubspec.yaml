name: napstop
description: "NapStop - ngủ không lỡ trạm: báo thức theo vị trí cho người đi xe khách, tàu đường dài."
# Private app, never published to pub.dev.
publish_to: 'none'

# build-name -> Android versionName / iOS CFBundleShortVersionString,
# build-number -> Android versionCode / iOS CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Used when no --flavor is given (flutter run, flutter build apk --debug).
  default-flavor: dev
