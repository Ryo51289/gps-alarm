# NapStop iOS CI (T14 Q1 = A, T01.2). Specs: docs/specs/T14.md, docs/specs/T01.2.md
#
# How to run, without gh or a token (T01.2 D1): push a branch named ci/ios-<kind>-<id>, <id> = [A-Za-z0-9._-]+:
#   ci/ios-swift-<id>  swift-macos only            ci/ios-ipa-<id>  ios-device only, with NAPSTOP_DIAG
#   ci/ios-sim-<id>    ios-sim only                ci/ios-all-<id>  every job
#   ci/ios-ipa-fb-<rest>, ci/ios-all-fb-<rest>  the same, plus telemetry: the IPA is built with NAPSTOP_TELEMETRY=on and
#                      the telemetry probe (T29.2 §4.2), for checks on an iPhone against the Firebase console
# Any other ci/ios-* name fails in `plan` (Linux) and no macOS job runs. workflow_dispatch from the web still works
# (target swift / simulator / device / both / all, plus `diag` and `telemetry` for the device IPA).
# Results: publish-results force-pushes a text summary to the branch ci-results/<branch> (one orphan commit);
#   git fetch origin ci-results/<branch> && git show FETCH_HEAD:summary.md
#   git push origin --delete <branch> ci-results/<branch>     # clean up when done
# Jobs:
# - plan (ubuntu): picks the jobs from the event and branch name (.github/scripts/ios-ci-plan.sh).
# - swift-macos: `swift test` of NapStopCore (app/ios/Core) on arm64 macOS, P05 included (T13, S18).
# - ios-sim: Flutter build for the Simulator, XCTest RunnerTests, then every file of
#   app/integration_test/ios_suite.txt with `flutter test -d <simulator>` (app/ios/scripts/ci-sim.sh).
# - ios-device: release build for a real iPhone (arm64), unsigned, artifact `napstop-ios-unsigned`
#   (NapStop-unsigned.ipa; install from WSL with `xtool install`). With diag, app/ios/Flutter/Diag.xcconfig adds
#   NAPSTOP_DIAG (T17 D21). Release, not debug: an iOS debug build cannot start without a debugger attached.
#   T29.2: Firebase checks of the bundle (app/ios/scripts/firebase-ci-check.sh: plist, collection keys off, no
#   AdSupport/ATT, privacy manifests; blocking), then the dSYMs go to Crashlytics (not blocking) and to the artifact
#   `napstop-ios-dsyms`.
# - publish-results (ubuntu): the only job with contents: write (.github/scripts/publish-ci-results.sh).
#
# FIREBASE_ANALYTICS_WITHOUT_ADID (workflow env, T29.2 D6): firebase_analytics then links FirebaseAnalyticsCore (no
# IDFA, no AdSupport). Any iOS build elsewhere (a Mac, T40.1) must export it too.
#
# Cost: the repo is public, so standard GitHub-hosted runners are free (T29.2 §4.1; T01.2 §6 assumed a private repo).
# Rough minutes per push, warm / cold cache: swift 6-9 / 12-15, sim 18-25 / 30-38, ipa 12-16 / 20-25,
# all 36-50 / 62-78. Still use the narrowest prefix (time); pushing the same branch again cancels the run in progress.
#
# Actions are pinned by SHA like ci.yml. FLUTTER_VERSION must match the dev machine (CLAUDE.md) and ci.yml.
name: iOS compile

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        type: choice
        options:
          - both
          - simulator
          - device
          - swift
          - all
        default: both
      diag:
        description: 'Device ipa with NAPSTOP_DIAG (Diag.xcconfig)'
        type: boolean
        default: false
      telemetry:
        description: 'Device ipa with NAPSTOP_TELEMETRY=on and the telemetry probe (T29.2)'
        type: boolean
        default: false
  push:
    branches:
      - 'ci/ios-**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FLUTTER_VERSION: '3.47.8'
  IOS_BUNDLE_ID: 'app.napstop'

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: .
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
      sim: ${{ steps.plan.outputs.sim }}
      ipa: ${{ steps.plan.outputs.ipa }}
      diag: ${{ steps.plan.outputs.diag }}
      telemetry: ${{ steps.plan.outputs.telemetry }}
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pick jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_TARGET: ${{ inputs.target }}
          IN_DIAG: ${{ inputs.diag }}
          IN_TELEMETRY: ${{ inputs.telemetry }}
        run: |
          set +e
          bash .github/scripts/ios-ci-plan.sh "$EVENT_NAME" "$REF_NAME" "$IN_TARGET" "$IN_DIAG" "$IN_TELEMETRY" \
            >"$RUNNER_TEMP/plan.out" 2>"$RUNNER_TEMP/plan.err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.err" >&2
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"

      - name: Result files
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          d="$RUNNER_TEMP/result/plan"
          mkdir -p "$d"
          {
            echo "## plan"
            echo
            echo "- status: $JOB_STATUS (event $EVENT_NAME, ref $REF_NAME)"
            if [ -s "$RUNNER_TEMP/plan.out" ]; then sed 's/^/- /' "$RUNNER_TEMP/plan.out"; fi
            if [ -s "$RUNNER_TEMP/plan.err" ]; then sed 's/^::error::/- error: /' "$RUNNER_TEMP/plan.err"; fi
          } > "$d/summary.md"
          printf 'start_epoch=%s\nend_epoch=%s\n' "$JOB_START" "$(date -u +%s)" > "$d/timing.env"
          cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result-plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-plan
          path: ${{ runner.temp }}/result/plan/
          retention-days: 3
          if-no-files-found: ignore

  swift-macos:
    name: swift-macos
    needs: plan
    if: needs.plan.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: app/ios/Core
    steps:
      - name: Start clock
        working-directory: .
        run: echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exit tests (#expect(processExitsWith:), U01) need Swift >= 6.2, i.e. Xcode 26. Same Xcode as ios-sim and
      # ios-device (ci-sim.sh xcode: newest release 26.x, beta/RC bundles skipped; T13 test #11).
      # No cache of app/ios/Core/.build: NapStopCore has no external package, and checkout resets every mtime, so a
      # restored .build would be rebuilt in full anyway (review T01.2 #2).
      - name: Select Xcode 26 and check Swift >= 6.2
        id: xcode
        run: |
          # Keep this step's stderr for the result summary (it failed with no trace on the first CI run, 06/11).
          exec 2> >(tee -a "$RUNNER_TEMP/setup.log" >&2)
          bash ../scripts/ci-sim.sh xcode >> "$GITHUB_OUTPUT"
          swift --version
          ver="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | awk 'NR == 1')"
          read -r major minor <<<"$ver"
          if [ -z "$major" ] || [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::NapStopCore tests need Swift >= 6.2 (Xcode 26); runner has '${ver:-unknown}'."
            exit 1
          fi

      - name: NapStopCore tests (release, T13)
        env:
          NAPSTOP_REPORT_DIR: ${{ runner.temp }}/swift-report
        run: |
          set -o pipefail
          swift test -c release --enable-testable-imports 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Upload swift-macos-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-macos-report
          path: |
            ${{ runner.temp }}/swift-report/
            ${{ runner.temp }}/swift-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Result files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          d="$RUNNER_TEMP/result/swift-macos"
          log="$RUNNER_TEMP/swift-test.log"
          report="$RUNNER_TEMP/swift-report"
          mkdir -p "$d"
          {
            echo "## swift-macos (NapStopCore, T13)"
            echo
            echo "- status: $JOB_STATUS"
            echo "- Xcode: $(xcodebuild -version | head -n 1); $(swift --version 2>&1 | head -n 1)"
            echo
            echo '```'
            if [ -f "$log" ]; then
              grep -E 'Test run with|Executed [0-9]+ tests?|error:' "$log" | tail -n 40 || echo "no test summary line"
            else
              echo "swift test did not run"
              if [ -f "$RUNNER_TEMP/setup.log" ]; then echo "--- setup step stderr (tail)"; tail -n 30 "$RUNNER_TEMP/setup.log"; fi
            fi
            echo '```'
            if [ -f "$report/killsweep/summary.md" ]; then echo; cat "$report/killsweep/summary.md"; fi
          } > "$d/summary.md"
          if [ -f "$log" ]; then tail -n 400 "$log" > "$d/swift-test.tail.log"; fi
          # Hashes of the report files, for comparison with the WSL run (tester T13.x).
          if [ -d "$report" ]; then
            (cd "$report" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > "$d/report-sha256.txt" || true
          fi
          printf 'start_epoch=%s\nend_epoch=%s\n' "$JOB_START" "$(date -u +%s)" > "$d/timing.env"
          cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result-swift-macos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-swift-macos
          path: ${{ runner.temp }}/result/swift-macos/
          retention-days: 3
          if-no-files-found: ignore

  ios-sim:
    name: ios-sim
    needs: plan
    if: needs.plan.outputs.sim == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Start clock
        working-directory: .
        run: echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Xcode as swift-macos: iOS 26 SDK and Simulator runtime (T17 AlarmKit), never the image default by accident.
      - name: Select Xcode 26
        id: xcode
        run: bash ios/scripts/ci-sim.sh xcode >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version
          # Confirms the flags used below exist in this Flutter (spec T14 [FL-SIM]).
          flutter build ios --help | grep -E -- '--simulator|--no-codesign|--debug'

      - name: Restore SwiftPM packages of the plugins
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-plugins-${{ runner.os }}-${{ steps.xcode.outputs.id }}-noadid${{ env.FIREBASE_ANALYTICS_WITHOUT_ADID }}-${{ hashFiles('app/pubspec.lock', 'app/ios/**/Package.resolved') }}
          restore-keys: |
            spm-plugins-${{ runner.os }}-${{ steps.xcode.outputs.id }}-noadid${{ env.FIREBASE_ANALYTICS_WITHOUT_ADID }}-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # flutter/flutter#176820: pubspec `default-flavor` also applies to iOS, but the
      # iOS project has no `dev` scheme yet (T00 R2). Edit the runner's checkout only.
      - name: Drop default-flavor for iOS (runner checkout only)
        run: |
          sed -i '' '/^  default-flavor: dev$/d' pubspec.yaml
          # Explicit if: `bash -e` ignores a failing `! cmd`, so that form only
          # works as the last line of the script.
          if grep -n 'default-flavor' pubspec.yaml; then
            echo "::error::default-flavor is still in pubspec.yaml"
            exit 1
          fi

      - name: Build iOS app for the simulator (no signing)
        id: build
        run: flutter build ios --simulator --debug --no-codesign 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save SwiftPM packages of the plugins
        # Not on a cancelled run: a half-downloaded store saved under the primary key would be "hit" from then on.
        if: ${{ !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Boot simulator
        id: sim
        run: |
          mkdir -p "$RUNNER_TEMP/result/ios-sim"
          udid="$(bash ios/scripts/ci-sim.sh select 2>"$RUNNER_TEMP/sim-select.txt")" ||
            { cat "$RUNNER_TEMP/sim-select.txt"; exit 1; }
          cat "$RUNNER_TEMP/sim-select.txt"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          bash ios/scripts/ci-sim.sh prepare "$udid" "$IOS_BUNDLE_ID" 2>&1 | tee "$RUNNER_TEMP/result/ios-sim/simctl-prepare.txt"

      - name: XCTest (RunnerTests)
        id: xctest
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # No parallel testing: it runs on "Clone 1 of …" and leaves the selected device shut down, so the
          # integration step found no device (first sim run, 06/11).
          bash ios/scripts/ci-sim.sh timeout 900 xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$UDID" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/xctest.xcresult" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/xctest.log"

      # Runs after a failed XCTest too: one paid run should report both.
      # One `flutter test` (one Xcode build, ~2-4 min) per simulated location, not per file (second sim run, 06/11: six
      # files took 6 builds and hit the job timeout). The files of one location run in a generated entrypoint
      # integration_test/ios_group_<n>_test.dart (gitignored), each file's main() inside a group named after it; files
      # without a location join the first group. `--no-uninstall`: by default flutter test uninstalls the app after the
      # run, which dropped the location grant and the fake-alarm switch for the next file (permission-missing).
      - name: Integration tests (ios_suite.txt)
        id: it
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          # Reaches the app through `simctl launch` (AppDelegate, NAPSTOP_DIAG Simulator builds only).
          SIMCTL_CHILD_NAPSTOP_DIAG_FAKE_ALARMS: '1'
        run: |
          # $files, $noloc and $points are space-separated lists of paths and lat,lng (no spaces): split on purpose (SC2086).
          # Boot again (xcodebuild may have shut the device down) and grant: the app is installed now (XCTest).
          bash ios/scripts/ci-sim.sh prepare "$UDID" "$IOS_BUNDLE_ID" 2>&1 | tee -a "$RUNNER_TEMP/result/ios-sim/simctl-prepare.txt" || true
          results="$RUNNER_TEMP/it-results.tsv"
          suite="$RUNNER_TEMP/suite.tsv"
          : > "$results"
          : > "$suite"
          points=""
          noloc=""
          while read -r file point _ <&3; do
            case "$file" in '' | '#'*) continue ;; esac
            if [ -z "${point:-}" ]; then
              noloc="$noloc $file"
              continue
            fi
            case " $points " in *" $point "*) ;; *) points="$points $point" ;; esac
            printf '%s\t%s\n' "$point" "$file" >> "$suite"
          done 3< integration_test/ios_suite.txt
          [ -n "$points" ] || points="-"
          failed=0
          n=0
          for point in $points; do
            n=$((n + 1))
            files="$(awk -F '\t' -v p="$point" '$1 == p { print $2 }' "$suite")"
            # shellcheck disable=SC2086
            if [ "$n" -eq 1 ]; then files="$(printf '%s\n' $noloc $files)"; fi
            entry="integration_test/ios_group_${n}_test.dart"
            {
              echo "// Generated by ios-compile.yml (T01.2) from ios_suite.txt. Never commit."
              echo "import 'package:flutter_test/flutter_test.dart';"
              i=0
              for f in $files; do i=$((i + 1)); echo "import '$(basename "$f")' as f$i;"; done
              echo "void main() {"
              i=0
              for f in $files; do i=$((i + 1)); echo "  group('$(basename "$f" .dart)', f$i.main);"; done
              echo "}"
            } > "$entry"
            # shellcheck disable=SC2086
            count="$(printf '%s\n' $files | grep -c .)"
            # shellcheck disable=SC2086
            echo "--- group $n: $count file(s): $(printf '%s ' $files)"
            log="$RUNNER_TEMP/it-group-$n.log"
            start="$(date -u +%s)"
            r=pass
            # Before each group: the grant and the container switch (no-op when already set).
            bash ios/scripts/ci-sim.sh grant "$UDID" "$IOS_BUNDLE_ID" 2>&1 | tee -a "$RUNNER_TEMP/result/ios-sim/simctl-prepare.txt" || true
            if [ "$point" != "-" ] && ! bash ios/scripts/ci-sim.sh location "$UDID" "$point"; then
              r=fail
            elif ! bash ios/scripts/ci-sim.sh timeout $((420 + 180 * count)) flutter test "$entry" -d "$UDID" \
                --no-uninstall --dart-define=NAPSTOP_EXPECT_FLAVOR=dev </dev/null 2>&1 | tee "$log"; then
              r=fail
            fi
            secs=$(($(date -u +%s) - start))
            for f in $files; do
              name="$(basename "$f" .dart)"
              fr="$r"
              # The github reporter prints "❌ <group> <test>" / "✅ <group> <test>" (group = file name). In a failed
              # group a file without either line did not run (build/launch failure, or the time limit).
              if [ "$r" = fail ]; then
                if grep -qF "❌ $name " "$log" 2>/dev/null; then fr=fail
                elif grep -qF "✅ $name " "$log" 2>/dev/null; then fr=pass
                else fr="fail (not run)"
                fi
              fi
              [ "$fr" = pass ] || failed=$((failed + 1))
              printf '%s\t%s\t%s\n' "$f" "$fr" "group $n, ${secs}s" >> "$results"
            done
          done
          cat "$results"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed integration test file(s) failed"
            exit 1
          fi

      - name: Result files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD: ${{ steps.build.outcome }}
          XCTEST: ${{ steps.xctest.outcome }}
          IT: ${{ steps.it.outcome }}
          CACHE_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.spm-cache.outputs.cache-matched-key }}
        run: |
          d="$RUNNER_TEMP/result/ios-sim"
          mkdir -p "$d"
          {
            echo "## ios-sim"
            echo
            echo "- status: $JOB_STATUS"
            echo "- Flutter: $(flutter --version 2>/dev/null | head -n 1); Xcode: $(xcodebuild -version | head -n 1)"
            echo "- SwiftPM cache: hit=${CACHE_HIT:-false} ${CACHE_KEY:+(restored $CACHE_KEY)}"
            # Name and runtime only (the select line also has the UDID).
            echo "- $(grep -m 1 '^Simulator:' "$RUNNER_TEMP/sim-select.txt" 2>/dev/null | sed -E 's/ \([0-9A-F-]+\)$//' || echo 'Simulator: not selected')"
            echo "- build: ${BUILD:-not run}; XCTest: ${XCTEST:-not run}; integration: ${IT:-not run}"
            echo "- simctl help location/privacy and grants: simctl-prepare.txt"
            echo
            echo "### XCTest"
            echo
            echo '```'
            grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ tests?, with|\*\* TEST (SUCCEEDED|FAILED) \*\*|error:" \
              "$RUNNER_TEMP/xctest.log" 2>/dev/null | tail -n 40 || echo "no XCTest summary"
            echo '```'
            echo
            echo "### Integration tests"
            echo
            echo "| file | result | time |"
            echo "|---|---|---|"
            if [ -s "$RUNNER_TEMP/it-results.tsv" ]; then
              while IFS=$'\t' read -r f r s; do echo "| $f | $r | $s |"; done < "$RUNNER_TEMP/it-results.tsv"
            else
              echo "| (none run) | | |"
            fi
            # ios_smoke_test diagnostics: permission states and the permission-missing list (names only).
            if ls "$RUNNER_TEMP"/it-group-*.log >/dev/null 2>&1; then
              echo
              echo '```'
              grep -h -m 5 'NAPSTOP_DIAG ' "$RUNNER_TEMP"/it-group-*.log || echo "no NAPSTOP_DIAG line"
              echo '```'
            fi
          } > "$d/summary.md"
          for log in "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/xctest.log "$RUNNER_TEMP"/it-*.log; do
            [ -f "$log" ] || continue
            tail -n 400 "$log" > "$d/$(basename "$log" .log).tail.log"
          done
          # A group log holds several files: also keep the results, exceptions and expectations of the whole run.
          # T23.3: each "EXCEPTION CAUGHT" block is kept whole (up to 40 lines, to its closing ════ line) so the message
          # and the test-file frames survive, plus the camera numbers printed by map_ios_test ("MI0…" lines). The closing
          # line is found with index(): a byte-wise awk would not repeat the 3-byte ═ in /^═+$/ (review R4-2).
          for log in "$RUNNER_TEMP"/it-group-*.log; do
            [ -f "$log" ] || continue
            awk '
              /EXCEPTION CAUGHT/ { block = 40 }
              block > 0 {
                print
                block--
                if (index($0, "════") == 1) block = 0
                next
              }
              /❌|✅|Xcode build done|BridgeException|TimeoutException|Expected:|Actual:|Which:|NAPSTOP_DIAG |MI0[0-9][a-z]? .*=|tests? passed|failed\./ { print }
            ' "$log" | head -n 400 > "$d/$(basename "$log" .log).digest.log" || true
            # The camera numbers of map_ios_test also go to their own .txt: publish-ci-results.sh keeps only the last 400
            # lines of a *.log, a .txt whole (review T23.3 R4-3). Public camera bounds, no user data.
            grep -E 'MI0[0-9][a-z]? .*=' "$log" > "$d/$(basename "$log" .log).mi.txt" || true
          done
          printf 'start_epoch=%s\nend_epoch=%s\n' "$JOB_START" "$(date -u +%s)" > "$d/timing.env"
          cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"
          bash ios/scripts/ci-sim.sh shutdown || true

      - name: Upload result-ios-sim
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-ios-sim
          path: ${{ runner.temp }}/result/ios-sim/
          retention-days: 3
          if-no-files-found: ignore

  ios-device:
    name: ios-device
    needs: plan
    if: needs.plan.outputs.ipa == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Start clock
        working-directory: .
        run: echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Xcode as swift-macos: iOS 26 SDK and Simulator runtime (T17 AlarmKit), never the image default by accident.
      - name: Select Xcode 26
        id: xcode
        run: bash ios/scripts/ci-sim.sh xcode >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version
          flutter build ios --help | grep -E -- '--no-codesign|--release'

      - name: Restore SwiftPM packages of the plugins
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-plugins-${{ runner.os }}-${{ steps.xcode.outputs.id }}-noadid${{ env.FIREBASE_ANALYTICS_WITHOUT_ADID }}-${{ hashFiles('app/pubspec.lock', 'app/ios/**/Package.resolved') }}
          restore-keys: |
            spm-plugins-${{ runner.os }}-${{ steps.xcode.outputs.id }}-noadid${{ env.FIREBASE_ANALYTICS_WITHOUT_ADID }}-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Same reason as in ios-sim (flutter/flutter#176820).
      - name: Drop default-flavor for iOS (runner checkout only)
        run: |
          sed -i '' '/^  default-flavor: dev$/d' pubspec.yaml
          if grep -n 'default-flavor' pubspec.yaml; then
            echo "::error::default-flavor is still in pubspec.yaml"
            exit 1
          fi

      # T01.2 D6: Release.xcconfig has `#include? "Diag.xcconfig"`; the file only exists on this runner.
      - name: Diagnostics flag (Diag.xcconfig)
        env:
          DIAG: ${{ needs.plan.outputs.diag }}
        run: |
          f=ios/Flutter/Diag.xcconfig
          if [ "$DIAG" = true ]; then
            # $(inherited) is for Xcode, not the shell.
            # shellcheck disable=SC2016
            {
              echo '// Written by ios-compile.yml (T01.2 D6) for a test IPA. Never commit.'
              echo 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) NAPSTOP_DIAG'
            } > "$f"
            cat "$f"
          else
            rm -f "$f"
            echo "diag off: no $f"
          fi

      # T29.2 §4.2: telemetry = the "fb" test IPA (collection forced on in dev, probe); otherwise consent decides.
      - name: Build iOS app for a device (release, no signing)
        id: build
        env:
          TELEMETRY: ${{ needs.plan.outputs.telemetry }}
        run: |
          defines=()
          if [ "$TELEMETRY" = true ]; then
            defines=(--dart-define=NAPSTOP_TELEMETRY=on --dart-define=NAPSTOP_TELEMETRY_PROBE=true)
          fi
          echo "telemetry: ${TELEMETRY:-false} ${defines[*]}"
          flutter build ios --release --no-codesign "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save SwiftPM packages of the plugins
        # Not on a cancelled run: a half-downloaded store saved under the primary key would be "hit" from then on.
        if: ${{ !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Build settings check
        env:
          DIAG: ${{ needs.plan.outputs.diag }}
        run: |
          # Text output, not -json: package resolution can print lines before the JSON (review T01.2 #5). Only the block
          # "Build settings for action build and target Runner:" counts; stderr goes to a file for diagnosis.
          xcodebuild -showBuildSettings -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            >"$RUNNER_TEMP/show-build-settings.txt" 2>"$RUNNER_TEMP/show-build-settings.err" ||
            { tail -n 40 "$RUNNER_TEMP/show-build-settings.err"; echo "::error::xcodebuild -showBuildSettings failed"; exit 1; }
          conditions="$(awk '
            /^Build settings for action / { t = $NF; sub(/:$/, "", t); next }
            t == "Runner" && $1 == "SWIFT_ACTIVE_COMPILATION_CONDITIONS" && $2 == "=" { sub(/^[^=]*= */, ""); print; exit }
          ' "$RUNNER_TEMP/show-build-settings.txt")"
          echo "SWIFT_ACTIVE_COMPILATION_CONDITIONS (Runner, Release) = $conditions" | tee "$RUNNER_TEMP/build-settings.txt"
          has=false
          case " $conditions " in *" NAPSTOP_DIAG "*) has=true ;; esac
          if [ "$DIAG" = true ] && [ "$has" != true ]; then
            echo "::error::diag build without NAPSTOP_DIAG in SWIFT_ACTIVE_COMPILATION_CONDITIONS"
            exit 1
          fi
          if [ "$DIAG" != true ] && [ "$has" = true ]; then
            echo "::error::NAPSTOP_DIAG set although diag is off"
            exit 1
          fi

      # T29.2 FD01: self-test first (each broken fake bundle must fail), then the real bundle. Blocking; never prints
      # the API key or the plist.
      - name: Firebase checks
        id: firebase-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash ios/scripts/firebase-ci-check.sh --self-test
          bash ios/scripts/firebase-ci-check.sh check build/ios/iphoneos/Runner.app | tee "$RUNNER_TEMP/firebase-check.txt"

      - name: TEMP T29.2 IDFA diagnostics (CI trial only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          app=build/ios/iphoneos/Runner.app
          {
            echo "- IDFA diag:"
            for b in "$app/Runner" "$app"/Frameworks/*.framework/*; do
              [ -f "$b" ] || continue
              case "$b" in *.plist | *.xcprivacy | *.nib | *.car) continue ;; esac
              file "$b" | grep -q Mach-O || continue
              echo "  - ${b#"$app"/}"
              otool -L "$b" | grep -E 'System/Library' | sed 's/^[[:space:]]*/    L /;s/ (compat.*//' || true
              strings -a "$b" | grep -oE 'ASIdentifierManager|advertisingIdentifier|IdentitySupport|ATTrackingManager|trackingAuthorizationStatus|AdSupport' | sort | uniq -c | sed 's/^/    S /' || true
              nm -u "$b" 2>/dev/null | grep -E 'ASIdentifier|ATTracking|AdSupport' | sed 's/^/    U /' || true
            done
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -path '*SourcePackages/artifacts*' -name '*.xcframework' 2>/dev/null | sed 's|.*/SourcePackages/|    A |' | sort -u
          } | tee -a "$RUNNER_TEMP/firebase-check.txt"

      # T29.2 FD02 / D5: not blocking (the IPA is usable without symbols). The tool output stays in
      # $RUNNER_TEMP/dsym-upload.log (not published: it may print the app id).
      - name: Upload dSYMs to Crashlytics
        id: dsyms
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          NAPSTOP_DSYM_OUT: ${{ runner.temp }}/dsyms
        run: bash ios/scripts/firebase-ci-check.sh upload-dsyms build ios/Runner/GoogleService-Info.plist | tee "$RUNNER_TEMP/dsym.txt"

      - name: Upload dSYM artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napstop-ios-dsyms
          path: ${{ runner.temp }}/dsyms/
          if-no-files-found: warn
          retention-days: 7

      # Also after a failed settings check: the IPA of a paid build stays available (the job is still red).
      - name: Package unsigned ipa
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app=build/ios/iphoneos/Runner.app
          test -d "$app" || { echo "::error::$app not found"; exit 1; }
          rm -rf build/ipa-staging
          mkdir -p build/ipa-staging/Payload
          cp -R "$app" build/ipa-staging/Payload/
          (cd build/ipa-staging && zip -qry ../NapStop-unsigned.ipa Payload)
          ls -l build/NapStop-unsigned.ipa

      - name: Upload unsigned ipa
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napstop-ios-unsigned
          path: app/build/NapStop-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Result files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DIAG: ${{ needs.plan.outputs.diag }}
          BUILD: ${{ steps.build.outcome }}
          CACHE_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.spm-cache.outputs.cache-matched-key }}
          TELEMETRY: ${{ needs.plan.outputs.telemetry }}
          FB_CHECK: ${{ steps.firebase-check.outcome }}
          DSYM: ${{ steps.dsyms.outcome }}
        run: |
          d="$RUNNER_TEMP/result/ios-device"
          mkdir -p "$d"
          {
            echo "## ios-device"
            echo
            echo "- status: $JOB_STATUS; build: ${BUILD:-not run}; diag: ${DIAG:-false}"
            if [ "$TELEMETRY" = true ]; then echo "- telemetry: on (NAPSTOP_TELEMETRY=on, probe)"; else echo "- telemetry: auto"; fi
            echo "- firebase checks: ${FB_CHECK:-not run}"
            if [ -f "$RUNNER_TEMP/firebase-check.txt" ]; then cat "$RUNNER_TEMP/firebase-check.txt"; fi
            echo "- dSYM step: ${DSYM:-not run}"
            if [ -f "$RUNNER_TEMP/dsym.txt" ]; then cat "$RUNNER_TEMP/dsym.txt"; fi
            echo "- Flutter: $(flutter --version 2>/dev/null | head -n 1); Xcode: $(xcodebuild -version | head -n 1)"
            echo "- SwiftPM cache: hit=${CACHE_HIT:-false} ${CACHE_KEY:+(restored $CACHE_KEY)}"
            echo "- $(cat "$RUNNER_TEMP/build-settings.txt" 2>/dev/null || echo 'build settings: not checked')"
            if [ -f build/NapStop-unsigned.ipa ]; then
              echo "- ipa: $(du -h build/NapStop-unsigned.ipa | cut -f1), artifact napstop-ios-unsigned (unsigned, 7 days; install with xtool install)"
            else
              echo "- ipa: not built"
            fi
          } > "$d/summary.md"
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 400 "$RUNNER_TEMP/build.log" > "$d/build.tail.log"; fi
          printf 'start_epoch=%s\nend_epoch=%s\n' "$JOB_START" "$(date -u +%s)" > "$d/timing.env"
          cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result-ios-device
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-ios-device
          path: ${{ runner.temp }}/result/ios-device/
          retention-days: 3
          if-no-files-found: ignore

  publish-results:
    name: publish-results
    needs: [plan, swift-macos, ios-sim, ios-device]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes ci-results/<branch> with GITHUB_TOKEN (does not start another workflow run)
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download job results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results

      - name: Publish to ci-results/${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/publish-ci-results.sh "$RUNNER_TEMP/results" "$REF_NAME"
