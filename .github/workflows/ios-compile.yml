# NapStop iOS compile check (T14 Q1 = A). Spec: docs/specs/T14.md
#
# Manual only (workflow_dispatch). Two jobs, picked with the `target` input:
# - ios-simulator: compiles the Flutter app for the iOS simulator, which compiles the
#   Pigeon Swift output (ios/Runner/Bridge/CoreApi.g.swift) and the iOS stub
#   (CoreBridgeStub.swift). No signing, nothing is uploaded.
# - ios-device: release build for a real iPhone (arm64), unsigned, uploaded as the
#   artifact `napstop-ios-unsigned` (NapStop-unsigned.ipa). Install on a phone from
#   WSL with `xtool install NapStop-unsigned.ipa`, which signs it with the developer's
#   own Apple ID (same path as the S3 probe). Release, not debug: an iOS debug build
#   cannot start without a debugger attached.
# - swift-macos (target `swift`, T13): `swift test` of the NapStopCore package (app/ios/Core) on arm64 macOS,
#   including P05 against fixtures/p05/manifest.json (S18). Spec: docs/specs/T13.md.
# About 10-15 min of macOS runner time per job; run it when Swift code changes
# (T14, T17) or when a device build is wanted.
#
# Actions are pinned to the same SHAs as ci.yml. FLUTTER_VERSION must match the dev
# machine (CLAUDE.md) and ci.yml.
name: iOS compile

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        type: choice
        options:
          - both
          - simulator
          - device
          - swift
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  ios-simulator:
    name: ios-simulator
    if: inputs.target != 'device' && inputs.target != 'swift'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version
          # Confirms the flags used below exist in this Flutter (spec T14 [FL-SIM]).
          flutter build ios --help | grep -E -- '--simulator|--no-codesign|--debug'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # flutter/flutter#176820: pubspec `default-flavor` also applies to iOS, but the
      # iOS project has no `dev` scheme yet (T00 R2). Edit the runner's checkout only.
      - name: Drop default-flavor for iOS (runner checkout only)
        run: |
          sed -i '' '/^  default-flavor: dev$/d' pubspec.yaml
          # Explicit if: `bash -e` ignores a failing `! cmd`, so that form only
          # works as the last line of the script.
          if grep -n 'default-flavor' pubspec.yaml; then
            echo "::error::default-flavor is still in pubspec.yaml"
            exit 1
          fi

      - name: Build iOS app for the simulator (no signing)
        run: flutter build ios --simulator --debug --no-codesign

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo '### ios-simulator'
            echo
            echo "- Flutter: $(flutter --version | head -n 1)"
            echo "- Xcode: $(xcodebuild -version | head -n 1)"
            app="$(find build/ios -maxdepth 3 -name 'Runner.app' -type d | head -n 1)"
            echo "- Runner.app: ${app:-not built}"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-device:
    name: ios-device
    if: inputs.target != 'simulator' && inputs.target != 'swift'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version
          flutter build ios --help | grep -E -- '--no-codesign|--release'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Same reason as in ios-simulator (flutter/flutter#176820).
      - name: Drop default-flavor for iOS (runner checkout only)
        run: |
          sed -i '' '/^  default-flavor: dev$/d' pubspec.yaml
          if grep -n 'default-flavor' pubspec.yaml; then
            echo "::error::default-flavor is still in pubspec.yaml"
            exit 1
          fi

      - name: Build iOS app for a device (release, no signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        run: |
          app=build/ios/iphoneos/Runner.app
          test -d "$app" || { echo "::error::$app not found"; exit 1; }
          rm -rf build/ipa-staging
          mkdir -p build/ipa-staging/Payload
          cp -R "$app" build/ipa-staging/Payload/
          (cd build/ipa-staging && zip -qry ../NapStop-unsigned.ipa Payload)
          ls -l build/NapStop-unsigned.ipa

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napstop-ios-unsigned
          path: app/build/NapStop-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo '### ios-device'
            echo
            echo "- Flutter: $(flutter --version | head -n 1)"
            echo "- Xcode: $(xcodebuild -version | head -n 1)"
            echo "- Commit: ${GITHUB_SHA}"
            if [ -f build/NapStop-unsigned.ipa ]; then
              echo "- ipa: $(du -h build/NapStop-unsigned.ipa | cut -f1), artifact napstop-ios-unsigned (unsigned; install with xtool install)"
            else
              echo "- ipa: not built"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  swift-macos:
    name: swift-macos
    if: inputs.target == 'swift'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app/ios/Core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exit tests (#expect(processExitsWith:), U01) need Swift >= 6.2, i.e. Xcode 26. Select the newest Xcode 26
      # installed on the runner image and fail early with a clear message if there is none.
      - name: Select Xcode 26 and check Swift >= 6.2
        run: |
          # Release builds only: skip beta/RC bundles (Xcode_26.1_beta_3.app sorts after Xcode_26.1.app; T13 test #11).
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          echo "- Xcode selected: ${xcode:-runner default}" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version
          swift --version
          ver="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)"
          read -r major minor <<<"$ver"
          if [ -z "$major" ] || [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::NapStopCore tests need Swift >= 6.2 (Xcode 26); runner has '${ver:-unknown}'."
            exit 1
          fi

      - name: NapStopCore tests (release, T13)
        env:
          NAPSTOP_REPORT_DIR: ${{ runner.temp }}/swift-report
        run: |
          set -o pipefail
          swift test -c release --enable-testable-imports 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Upload swift-macos-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-macos-report
          path: |
            ${{ runner.temp }}/swift-report/
            ${{ runner.temp }}/swift-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## swift-macos (NapStopCore, T13)"
            xcodebuild -version | head -n 1
            grep -E 'Test run with' "$RUNNER_TEMP/swift-test.log" || echo "no test summary"
            cat "$RUNNER_TEMP/swift-report/killsweep/summary.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
